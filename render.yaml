services:
  - type: web
    name: mythri-family-restaurant
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
        description: "Your Neon PostgreSQL Connection String (DATABASE_URL)"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
        description: "Your Cloudinary Cloud Name"
      - key: CLOUDINARY_API_KEY
        sync: false
        description: "Your Cloudinary API Key"
      - key: CLOUDINARY_API_SECRET
        sync: false
        description: "Your Cloudinary API Secret"

